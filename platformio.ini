; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-poe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-poe
framework = arduino
board_build.partitions = min_spiffs.csv
; Web assets are embedded directly into flash (no convert.py / WebFiles.cpp).
; HTML templates go in embed_txtfiles (null-terminated for string printing);
; the pre-gzipped css/js go in embed_files (raw binary). objcopy names the
; symbols _binary_html_<name>_start/_end (see Web.cpp).
board_build.embed_txtfiles =
	html/config.html
	html/restart.html
board_build.embed_files =
	html/bootstrap.min.css.gz
	html/bootstrap.bundle.min.js.gz
	html/headers.css.gz
	html/validate-forms.js.gz
monitor_speed = 115200
monitor_filters = time
build_flags = -Wall -DCORE_DEBUG_LEVEL=3 -DNETWORK_CONTROLLER=3
lib_deps =
	u8g2
	moononournation/GFX Library for Arduino@1.6.6
	https://github.com/hoeken/PsychicHttp.git
