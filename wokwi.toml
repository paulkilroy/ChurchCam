# Wokwi ESP32 simulator config. Run via the Wokwi VS Code extension (or wokwi-cli
# with a WOKWI_CLI_TOKEN). Pairs with diagram.json (the virtual wiring).
# The firmware detects the simulator by Wokwi's fixed MAC (ChurchCam.cpp) and
# takes the InSimulator path: no Ethernet, joins "Wokwi-GUEST" WiFi, uses the
# "Simulator" pinout (ChurchCam.cpp Pinouts[REV_SIM]).
[wokwi]
version = 1
elf = ".pio/build/esp32-poe/firmware.elf"
firmware = ".pio/build/esp32-poe/firmware.bin"
gdbServerPort=3333
rfc2217ServerPort = 4000

# Use the LOCAL private gateway (run: simulator/wokwigw) instead of Wokwi's cloud
# gateway, so the simulated device can reach the host's Node camera/ATEM sims
# (incl. UDP). Requires a Wokwi Club license. Reach the host via host.wokwi.internal.
[net]
gateway = "ws://localhost:9011"

# net.forward exposes a port on the simulated device TO your host (host -> guest).
# Use it to open the device's web config / websocket from your browser.
# NOTE: this only forwards INBOUND. The simulated device runs in Wokwi's cloud and
# CANNOT reach host-local services (the Node camera/ATEM sims) -- see simulator/README.

# http://localhost:8180  ->  device web config AND the /ws telemetry socket, both
# now on port 80 (PsychicHttp serves them together; the old separate :3000
# WebSocket is gone). The self-hosted wokwigw also exposes this on :9080.
[[net.forward]]
from = "localhost:8180"
to = "target:80"